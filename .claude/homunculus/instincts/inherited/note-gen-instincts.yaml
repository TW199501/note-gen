# Note Gen Workflow Test Infrastructure Upgrade

## Action

Follow the test-infrastructure-upgrade workflow:
1. Install or upgrade test runner dependencies in package.json and pnpm-lock.yaml
2. Add or update test config files (e.g., vitest.config.ts, playwright.config.ts, vitest.setup.ts)
3. Add or update .gitignore and ESLint config to handle new test artifacts
4. Create or update test files (e2e/*.spec.ts, src/lib/**/*.test.ts, src/stores/**/*.test.ts)
5. Verify tests run and pass (vitest, playwright, etc.)

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: package.json, pnpm-lock.yaml, vitest.config.ts

