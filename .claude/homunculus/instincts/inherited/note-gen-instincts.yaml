# Note Gen Workflow Test Driven Development With Plan Docs

## Action

Follow the test-driven-development-with-plan-docs workflow:
1. Write a test plan in docs/superpowers/plans/ describing test cases and mutation checks.
2. Implement or expand tests in the relevant *.test.tsx file.
3. Mutation-verify each test by temporarily breaking production code and confirming test failure.
4. Address code review feedback by adding new test cases or tightening existing ones.
5. Update the plan doc to reflect any changes or corrections in test coverage.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: docs/superpowers/plans/*.md, src/app/core/main/browser/*.test.tsx

