# Note Gen Workflow Browser Feature Development

## Action

Follow the browser-feature-development workflow:
1. Add/modify Rust commands and event emitters in src-tauri/src/browser.rs (and sometimes src-tauri/src/lib.rs or src-tauri/src/main.rs)
2. Update or create frontend React components in src/app/core/main/browser/*.tsx
3. Update or add zustand store logic and tests in src/stores/browser.ts and src/stores/browser.test.ts
4. Add/modify pure logic helpers and unit tests in src/lib/browser/*.ts and src/lib/browser/*.test.ts
5. Update i18n keys in messages/*.json for new UI strings
6. Update or create database helpers and tests in src/db/*.ts if persistent data is needed
7. Update capability JSONs if new permissions are required (src-tauri/capabilities/*.json)
8. Run and verify all tests (vitest, cargo, tsc, eslint, playwright)

## Evidence

- Workflow detected from commit patterns
- Frequency: ~4x per month
- Files: src-tauri/src/browser.rs, src-tauri/src/lib.rs, src-tauri/src/main.rs

