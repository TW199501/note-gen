# Note Gen Workflow Defensive Bugfix And Mock Improvement

## Action

Follow the defensive-bugfix-and-mock-improvement workflow:
1. Identify and fix the bug in the relevant TypeScript or Rust file (e.g., add null checks, use correct return values)
2. Update or expand test mocks (e2e/tauri-mock.ts) to simulate missing plugin or runtime APIs
3. Add or update error-audit or regression tests (e2e/error-audit.spec.ts)
4. Verify error count is reduced or eliminated in test runs

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: src/db/*.ts, src/lib/*.ts, src/app/core/main/*.tsx

