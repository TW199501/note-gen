# Note Gen Workflow Spec Plan Implementation Workflow

## Action

Follow the spec-plan-implementation-workflow workflow:
1. Write a design spec in docs/superpowers/specs/ (or specs/archive/ for historical context).
2. Write an implementation plan in docs/superpowers/plans/ (or plans/archive/ for historical context).
3. Implement code changes across src-tauri/, src/app/core/main/browser/, scripts/, etc.
4. Update .gitignore or package.json if new scripts or resources are added.
5. Bundle new resources/configs as needed (e.g., tauri.windows.conf.json).
6. Archive superseded specs/plans in docs/superpowers/{specs,plans}/archive/.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~1x per month
- Files: docs/superpowers/specs/*.md, docs/superpowers/plans/*.md, docs/superpowers/specs/archive/*.md

