# Increase main thread stack size on Windows to prevent STATUS_STACK_BUFFER_OVERRUN
# caused by WebView2 COM initialization depth when using Tauri's child WebView ("unstable" feature).
# Default Windows MSVC stack is 1MB; WebView2 initialization requires significantly more.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:8388608"]
